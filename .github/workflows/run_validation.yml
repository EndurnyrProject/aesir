on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: "github.event.pull_request.draft != true && !startsWith(github.head_ref, 'release-please--') && !contains(github.event.head_commit.message, 'ci skip')"
    name: Compile, Format, Credo, Dialyzer
    runs-on: warp-ubuntu-2604-arm64-8x
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Setup Elixir and Erlang
      uses: jdx/mise-action@v2

    - name: Install Hex and Rebar
      run: mix local.hex --force && mix local.rebar --force

    - name: Restore deps and _build
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: |
          deps
          _build
        key: mix-lint-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: mix-lint-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-

    - name: Fetch Dependencies
      run: mix deps.get

    - name: Run Checks
      run: mix check --except ex_unit

    - name: Save deps and _build
      if: always() && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          deps
          _build
        key: ${{ steps.cache.outputs.cache-primary-key }}

  test:
    if: "github.event.pull_request.draft != true && !startsWith(github.head_ref, 'release-please--') && !contains(github.event.head_commit.message, 'ci skip')"
    name: Test (${{ matrix.mode }})
    runs-on: warp-ubuntu-2604-arm64-8x
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [renewal, pre_renewal]
    env:
      AESIR_DB_MODE: ${{ matrix.mode }}
      MIX_ENV: test

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup Elixir and Erlang
      uses: jdx/mise-action@v2

    - name: Install Hex and Rebar
      run: mix local.hex --force && mix local.rebar --force

    - name: Restore deps and _build
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: |
          deps
          _build
        key: mix-test-${{ matrix.mode }}-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: mix-test-${{ matrix.mode }}-${{ runner.os }}-${{ hashFiles('.mise.toml') }}-

    - name: Fetch and Compile
      run: mix deps.get && mix compile

    - name: Save deps and _build
      if: always() && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          deps
          _build
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Run Unit Tests
      run: mix test

    - name: Run Integration Tests
      run: mix test.integration
