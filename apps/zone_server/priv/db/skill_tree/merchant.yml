---
- job: merchant
  inherit:
    - novice
  tree:
    - name: MC_PUSHCART
      max_level: 10
    - name: MC_CHANGECART
      max_level: 1
      # rAthena gates Change Cart via `State: Cart` (must have a cart equipped),
      # not a skill prereq; we model that as the tree prerequisite MC_PUSHCART.
      requires:
        - name: MC_PUSHCART
          level: 1
    - name: MC_CARTREVOLUTION
      max_level: 1
      # rAthena's re skill_tree gives Cart Revolution no skill prereq; it is gated
      # in-game by `State: Cart` (a cart must be mounted). We model that mounted-cart
      # requirement as the tree prerequisite MC_PUSHCART, at the design's lv5 gate.
      requires:
        - name: MC_PUSHCART
          level: 5
