syntax = "proto3";

// Aesir network protocol.
//
// Single source of truth for the wire messages exchanged between the Aesir
// servers and the custom client The Elixir side is generated by
// protox (package `aesir.net` -> `Aesir.Net.*` modules); the client generates
// the same schema with prost.
//
// Every reliable frame and every datagram carries exactly one Envelope as its
// payload (the bevy_quinnet channel framing delimits it; see QuinnetCodec).
package aesir.net;

// Wrapper around every application message. `seq` is a per-sender monotonic
// counter used for correlation; `body` selects the concrete message. Field
// numbers are grouped by category: 16-31 control, 32-63 client intents,
// 64+ authoritative/world.
message Envelope {
  uint32 seq = 1;

  oneof body {
    // 16-20: account control
    Hello hello = 16;
    HelloAck hello_ack = 17;
    LoginRequest login_request = 18;
    LoginResponse login_response = 19;
    LoginFailed login_failed = 20;
    // 21-31: char control
    SessionAuth session_auth = 21;
    CharList char_list = 22;
    CharAuthFailed char_auth_failed = 23;
    SelectChar select_char = 24;
    ZoneServerInfo zone_server_info = 25;
    CreateChar create_char = 26;
    CharCreated char_created = 27;
    CharCreateFailed char_create_failed = 28;
    DeleteCharRequest delete_char_request = 29;
    DeleteCharAck delete_char_ack = 30;
    CharListRefresh char_list_refresh = 31;
    // 32+: zone
    MapLoaded map_loaded = 32;
    TimeSync time_sync = 33;
    TimeSyncAck time_sync_ack = 34;
    EnterAck enter_ack = 35;
    MoveRequest move_request = 36;
    SelfMove self_move = 37;
    MoveStop move_stop = 38;
    UnitSpawn unit_spawn = 39;
    UnitDespawn unit_despawn = 40;
    NameRequest name_request = 41;
    NameResponse name_response = 42;
    ChatRequest chat_request = 43;
    ChatMessage chat_message = 44;
    Snapshot snapshot = 45;
    // 46-71: zone combat / skill / item / stat
    ActionRequest action_request = 46;
    DamageDealt damage_dealt = 47;
    Knockback knockback = 48;
    SkillCast skill_cast = 49;
    GroundSkillCast ground_skill_cast = 50;
    SkillList skill_list = 51;
    SkillDamage skill_damage = 52;
    SkillEffect skill_effect = 53;
    SkillCasting skill_casting = 54;
    CastCancel cast_cancel = 55;
    SkillCooldown skill_cooldown = 56;
    GroundSkill ground_skill = 57;
    EquipItem equip_item = 58;
    UnequipItem unequip_item = 59;
    EquipResult equip_result = 60;
    UnequipResult unequip_result = 61;
    InventoryList inventory_list = 62;
    ItemAdded item_added = 63;
    ItemRemoved item_removed = 64;
    StatUp stat_up = 65;
    StatUpResult stat_up_result = 66;
    ParamChange param_change = 67;
    UnitHp unit_hp = 68;
    SpriteChange sprite_change = 69;
    Resurrect resurrect = 70;
    Respawn respawn = 71;
    LearnSkill learn_skill = 72;
    LearnSkillResult learn_skill_result = 73;
    MapMove map_move = 74;
    UseItem use_item = 75;
    ItemUseResult item_use_result = 76;
    StatusChange status_change = 77;
    UnitStateChange unit_state_change = 78;
    SpecialEffect special_effect = 79;
    NpcTalk npc_talk = 80;
    NpcDialog npc_dialog = 81;
    NpcInteract npc_interact = 82;
    // 83-88: cart (server->client deltas + client intents)
    CartInfo cart_info = 83;
    CartItemAdded cart_item_added = 84;
    CartItemRemoved cart_item_removed = 85;
    CartMountRequest cart_mount_request = 86;
    MoveToCartRequest move_to_cart_request = 87;
    MoveFromCartRequest move_from_cart_request = 88;
    // 89-96: vending (client intents + server->client board/list/sale deltas)
    VendingOpenRequest vending_open_request = 89;
    VendingCloseRequest vending_close_request = 90;
    VendingListRequest vending_list_request = 91;
    VendingPurchaseRequest vending_purchase_request = 92;
    VendingBoardShown vending_board_shown = 93;
    VendingBoardRemoved vending_board_removed = 94;
    VendingList vending_list = 95;
    VendingSaleReport vending_sale_report = 96;
    // 97-101: npc shop (server->client window/result + client buy/sell intents)
    NpcShopOpen npc_shop_open = 97;
    NpcBuyRequest npc_buy_request = 98;
    NpcSellRequest npc_sell_request = 99;
    NpcBuyResult npc_buy_result = 100;
    NpcSellResult npc_sell_result = 101;
    // 102-105: item drops (server->client ground spawn/vanish + client pickup intent/result)
    ItemOnGround item_on_ground = 102;
    ItemVanished item_vanished = 103;
    PickupItemRequest pickup_item_request = 104;
    PickupResult pickup_result = 105;
    // 106-116: party
    PartyCreateRequest party_create_request = 106;
    PartyInviteRequest party_invite_request = 107;
    PartyInviteNotify party_invite_notify = 108;
    PartyInviteResponse party_invite_response = 109;
    PartyLeaveRequest party_leave_request = 110;
    PartyKickRequest party_kick_request = 111;
    PartyOptionsRequest party_options_request = 112;
    PartyLeaderRequest party_leader_request = 113;
    PartyActionResult party_action_result = 114;
    PartyInfo party_info = 115;
    PartyDisbanded party_disbanded = 116;
    // 117-123: storage (server->client window/deltas/result + client deposit/withdraw/close intents)
    StorageOpened storage_opened = 117;
    StorageDepositRequest storage_deposit_request = 118;
    StorageWithdrawRequest storage_withdraw_request = 119;
    StorageCloseRequest storage_close_request = 120;
    StorageItemAdded storage_item_added = 121;
    StorageItemRemoved storage_item_removed = 122;
    StorageResult storage_result = 123;
    // 124: broadcast messages (GM + script announce/mapannounce/areaannounce/broadcast)
    Announcement announcement = 124;
    // 125-126: cart/vending results (server->client outcome of a gated intent)
    CartMountResult cart_mount_result = 125;
    VendingOpenResult vending_open_result = 126;
    // 127-128: emotes (client intent + server->client display)
    EmoteRequest emote_request = 127;
    Emotion emotion = 128;
    // 129-133: quest log (server->client dump + deltas)
    QuestList quest_list = 129;
    QuestAdded quest_added = 130;
    QuestRemoved quest_removed = 131;
    QuestStateChanged quest_state_changed = 132;
    QuestHuntProgress quest_hunt_progress = 133;
    // 134: minimap viewpoint marker (script viewpoint buildin)
    Viewpoint viewpoint = 134;
    // 135-136: script cutscene image + sound effect (cutin/soundeffect buildins)
    Cutin cutin = 135;
    SoundEffect sound_effect = 136;
    // 137: party member state delta
    PartyMemberUpdate party_member_update = 137;
    // 138-154: guild (client intents + server->client roster/emblem/notice deltas)
    GuildCreateRequest guild_create_request = 138;
    GuildInviteRequest guild_invite_request = 139;
    GuildInviteResponse guild_invite_response = 140;
    GuildLeaveRequest guild_leave_request = 141;
    GuildExpelRequest guild_expel_request = 142;
    GuildPositionEditRequest guild_position_edit_request = 143;
    GuildMemberPositionRequest guild_member_position_request = 144;
    GuildNoticeEditRequest guild_notice_edit_request = 145;
    GuildEmblemUploadRequest guild_emblem_upload_request = 146;
    GuildEmblemRequest guild_emblem_request = 147;
    GuildActionResult guild_action_result = 148;
    GuildInviteNotify guild_invite_notify = 149;
    GuildInfo guild_info = 150;
    GuildMemberUpdate guild_member_update = 151;
    GuildEmblemChanged guild_emblem_changed = 152;
    GuildEmblemData guild_emblem_data = 153;
    GuildDisbanded guild_disbanded = 154;
    // 155-159: persistent skill-unit state and caster-only Estimation results
    SkillUnitSnapshot skill_unit_snapshot = 155;
    SkillUnitSpawn skill_unit_spawn = 156;
    SkillUnitUpdate skill_unit_update = 157;
    SkillUnitDespawn skill_unit_despawn = 158;
    EstimationResult estimation_result = 159;
    // 160-161: generic skill menu (server->client offer + client selection)
    SkillMenu skill_menu = 160;
    SkillMenuReply skill_menu_reply = 161;
    // 162: caster-only reason for a rejected skill cast
    SkillCastFailed skill_cast_failed = 162;
    // 163: authoritative absolute spirit-sphere state
    SpiritSphereUpdate spirit_sphere_update = 163;
    // 164-165: peco mount (client intent + server->client outcome)
    MountRequest mount_request = 164;
    MountResult mount_result = 165;
    // 166-167: staged skill text input
    SkillTextInputRequest skill_text_input_request = 166;
    SkillTextInputReply skill_text_input_reply = 167;
    // 168: server-authoritative production outcome
    ProductionResult production_result = 168;
    // 169-171: owner-private Homunculus commands, results, and state
    HomunculusRequest homunculus_request = 169;
    HomunculusResult homunculus_result = 170;
    HomunculusPrivateState homunculus_private_state = 171;
    // 172: inventory item binding update
    ItemBound item_bound = 172;
  }
}

// Optional features advertised in Hello; HelloAck returns the negotiated intersection.
enum FeatureCapability {
  FEATURE_CAPABILITY_UNSPECIFIED = 0;
  FEATURE_CAPABILITY_SKILL_TEXT_INPUT = 1;
}

// Client -> server, first message on the Control channel after connect.
// Capabilities are optional and do not change the protocol-version baseline.
message Hello {
  uint32 protocol_version = 1;
  string build = 2;
  repeated FeatureCapability capabilities = 3;
}

// Server -> client, response to Hello with the negotiated capability intersection.
message HelloAck {
  uint32 protocol_version = 1;
  bool accepted = 2;
  repeated FeatureCapability capabilities = 3;
}

// Server -> client prompt for one skill text value. request_id correlates its reply.
message SkillTextInputRequest {
  uint64 request_id = 1;
  uint32 skill_id = 2;
  uint32 max_utf8_bytes = 3; // Maximum UTF-8 byte length accepted for text.
}

// Client -> server reply for the pending request_id. Cancel abandons it without text.
message SkillTextInputReply {
  uint64 request_id = 1;

  oneof outcome {
    string text = 2;
    bool cancel = 3;
  }
}

// Client -> server, account login request (replaces RO CA_LOGIN).
message LoginRequest {
  string username = 1;
  string password = 2;
  uint32 client_version = 3;
}

// One available character server, included in a successful LoginResponse.
message CharServerInfo {
  string name = 1;
  string ip = 2;
  uint32 port = 3;
  uint32 user_count = 4;
  uint32 server_type = 5;
  bool is_new = 6;
}

// Server -> client, successful login (replaces RO AC_ACCEPT_LOGIN).
message LoginResponse {
  uint32 account_id = 1;
  uint32 login_id1 = 2;
  uint32 login_id2 = 3;
  uint32 sex = 4;
  string auth_token = 5;
  repeated CharServerInfo char_servers = 6;
}

// Server -> client, rejected login (replaces RO AC_REFUSE_LOGIN).
message LoginFailed {
  uint32 reason_code = 1;
  string message = 2;
}

// Client -> server, authenticate an existing Horde session on char/zone entry.
// `char_id` is unused by the char server but reserved for zone reuse.
message SessionAuth {
  uint32 account_id = 1;
  uint32 login_id1 = 2;
  uint32 login_id2 = 3;
  uint32 sex = 4;
  uint32 char_id = 5;
  // Single-use handoff token issued by the char server in ZoneServerInfo.auth_token.
  // Required by the zone server to prove the client passed character selection;
  // unused on the char-server entry path.
  bytes zone_auth_token = 6;
}

// A single character's full state (protobuf analogue of the legacy 175-byte CharacterInfo).
message Character {
  uint32 gid = 1;
  string name = 2;
  uint32 class = 3;
  uint32 base_level = 4;
  uint32 job_level = 5;
  uint64 base_exp = 6;
  uint64 job_exp = 7;
  uint32 zeny = 8;
  uint64 hp = 9;
  uint64 max_hp = 10;
  uint64 sp = 11;
  uint64 max_sp = 12;
  uint32 str = 13;
  uint32 agi = 14;
  uint32 vit = 15;
  uint32 int = 16;
  uint32 dex = 17;
  uint32 luk = 18;
  uint32 status_point = 19;
  uint32 skill_point = 20;
  uint32 hair = 21;
  uint32 hair_color = 22;
  uint32 clothes_color = 23;
  uint32 weapon = 24;
  uint32 shield = 25;
  uint32 head_top = 26;
  uint32 head_mid = 27;
  uint32 head_bottom = 28;
  uint32 robe = 29;
  uint32 char_num = 30;
  string last_map = 31;
  uint32 sex = 32;
  uint32 option = 33;
  uint32 karma = 34;
  uint32 manner = 35;
  uint32 rename = 36;
  uint64 delete_date = 37;
  uint32 pow = 38;
  uint32 sta = 39;
  uint32 wis = 40;
  uint32 spl = 41;
  uint32 con = 42;
  uint32 crt = 43;
  uint32 trait_point = 44;
  uint32 ap = 45;
  uint32 max_ap = 46;
}

// Server -> client, full character list response (replaces the legacy multi-packet char-list).
message CharList {
  uint32 account_id = 1;
  uint32 normal_slots = 2;
  uint32 premium_slots = 3;
  uint32 billing_slots = 4;
  uint32 producible_slots = 5;
  uint32 valid_slots = 6;
  repeated Character characters = 7;
  uint32 page_count = 8;
  bool pincode_enabled = 9;
}

// Server -> client, rejected session authentication on the char server.
message CharAuthFailed {
  uint32 reason = 1;
}

// Client -> server, select a character by slot (replaces RO CH_SELECT_CHAR).
message SelectChar {
  uint32 slot = 1;
}

// Server -> client, zone server to connect to after selecting a character.
message ZoneServerInfo {
  uint32 char_id = 1;
  string map_name = 2;
  string ip = 3;
  uint32 port = 4;
  // Single-use token the client must echo back in SessionAuth.zone_auth_token
  // when connecting to this zone server.
  bytes auth_token = 5;
}

// Client -> server, create a new character (replaces RO CH_MAKE_CHAR_V2).
message CreateChar {
  string name = 1;
  uint32 slot = 2;
  uint32 hair_color = 3;
  uint32 hair_style = 4;
  uint32 starting_job = 5;
  uint32 sex = 6;
}

// Server -> client, newly created character data.
message CharCreated {
  Character character = 1;
}

// Server -> client, character creation failed.
message CharCreateFailed {
  uint32 reason_code = 1;
}

// Client -> server, request character deletion (replaces RO CH_REQ_CHAR_DELETE2).
message DeleteCharRequest {
  uint32 char_id = 1;
}

// Server -> client, acknowledgement of a deletion request.
message DeleteCharAck {
  uint32 char_id = 1;
  uint32 result = 2;
  uint64 delete_date = 3;
}

// Client -> server, request a fresh character list (replaces RO CH_CHARLIST_REQ).
message CharListRefresh {}

// Client -> server, the map finished loading; spawn me (replaces RO CZ_NOTIFY_ACTORINIT 0x007D).
message MapLoaded {}

// Client -> server, client clock for time sync (replaces RO CZ_REQUEST_TIME/TIME2).
message TimeSync {
  uint32 client_tick = 1;
}

// Server -> client, authoritative clock reply (replaces RO ZC_NOTIFY_TIME/TIME2).
message TimeSyncAck {
  uint32 server_tick = 1;
}

// Server -> client, accept zone entry (replaces RO ZC_ACCEPT_ENTER 0x02EB + ZC_AID 0x0283).
message EnterAck {
  uint32 account_id = 1;
  uint32 x = 2;
  uint32 y = 3;
  uint32 dir = 4;
  uint64 start_time = 5;
  uint32 font = 6;
}

// Server -> client, load a different map and reposition there (replaces RO
// ZC_NPCACK_MAPMOVE 0x0091). The client unloads the current map, loads
// `map_name`, places the character at (x, y), and re-sends MapLoaded.
message MapMove {
  string map_name = 1;
  uint32 x = 2;
  uint32 y = 3;
}

// Client -> server, request to move to a destination cell (replaces RO CZ_REQUEST_MOVE2 0x035F).
message MoveRequest {
  uint32 dest_x = 1;
  uint32 dest_y = 2;
}

// Server -> client, own-character authoritative movement (replaces RO ZC_NOTIFY_PLAYERMOVE 0x0087).
message SelfMove {
  uint32 src_x = 1;
  uint32 src_y = 2;
  uint32 dst_x = 3;
  uint32 dst_y = 4;
  uint64 start_time = 5;
}

// Server -> client, an entity stopped moving (replaces RO ZC_NOTIFY_MOVE_STOP 0x0088).
message MoveStop {
  uint32 gid = 1;
  uint32 x = 2;
  uint32 y = 3;
}

// Server -> client, an entity entered view (collapses RO ZC_NOTIFY_NEWENTRY 0x09FE,
// ZC_NOTIFY_STANDENTRY 0x09FF and ZC_NOTIFY_MOVEENTRY 0x09FD). The `moving`, `dst_*` and
// `move_start_time` fields carry the moveentry case.
message UnitSpawn {
  uint32 gid = 1;
  uint32 aid = 2;
  uint32 object_type = 3;
  uint32 job = 4;
  uint32 x = 5;
  uint32 y = 6;
  uint32 dir = 7;
  uint32 speed = 8;
  uint32 hp = 9;
  uint32 max_hp = 10;
  uint32 clevel = 11;
  uint32 body_state = 12;
  uint32 health_state = 13;
  uint32 effect_state = 14;
  uint32 head = 15;
  uint32 weapon = 16;
  uint32 shield = 17;
  uint32 accessory = 18;
  uint32 accessory2 = 19;
  uint32 accessory3 = 20;
  uint32 head_palette = 21;
  uint32 body_palette = 22;
  uint32 head_dir = 23;
  uint32 robe = 24;
  uint32 guild_id = 25;
  uint32 sex = 26;
  bool is_boss = 27;
  string name = 28;
  bool moving = 29;
  uint32 dst_x = 30;
  uint32 dst_y = 31;
  uint64 move_start_time = 32;
  uint32 virtue = 33;
  string guild_name = 34;
  uint32 emblem_id = 35;
  uint32 spirit_sphere_count = 36;
  uint64 spirit_sphere_revision = 37;
}

// Server -> client, authoritative absolute spirit-sphere state for a unit.
message SpiritSphereUpdate {
  uint32 unit_id = 1;
  uint32 count = 2;
  uint64 revision = 3;
}

// Server -> client, an entity left view (replaces RO ZC_NOTIFY_VANISH 0x0080).
message UnitDespawn {
  uint32 gid = 1;
  uint32 reason = 2;
}

// EFST icon bar — apply (on=true) / remove (on=false).
message StatusChange {
  uint32 unit_id   = 1;   // target AID/GID
  uint32 efst      = 2;   // rAthena EFST id
  bool   on        = 3;
  uint32 total_ms  = 4;   // 0 = infinite
  uint32 remain_ms = 5;   // 0 = infinite
  int32  val1      = 6;
  int32  val2      = 7;
  int32  val3      = 8;
}

// Sprite ailment state — the unit's aggregate opt fields.
message UnitStateChange {
  uint32 unit_id      = 1;
  uint32 body_state   = 2;   // opt1  (single-valued)
  uint32 health_state = 3;   // opt2  (bitmask)
  uint32 effect_state = 4;   // option (bitmask)
  uint32 virtue       = 5;   // opt3  (bitmask)
}

// One-shot effect — fire and forget.
message SpecialEffect {
  uint32 source_id = 1;
  uint32 effect_id = 2;      // rAthena EF_* id
}

// Server -> client, a minimap/compass marker (replaces RO ZC_COMPASS 0x0144).
// Sent only to the invoking player (script `viewpoint`).
message Viewpoint {
  uint32 npc_id = 1;   // the NPC that owns the marker (rAthena st->oid)
  uint32 type = 2;     // action: 0 remove / 1 display / 2 display+remove-others
  uint32 x = 3;
  uint32 y = 4;
  uint32 id = 5;       // marker slot / point number
  uint32 color = 6;    // 0xRRGGBB
}

// Server -> client, a cutscene illustration overlay (replaces RO ZC_SHOW_IMAGE).
// Sent only to the invoking player (script `cutin`).
message Cutin {
  string image = 1;   // illustration bitmap name; empty with type 255 clears all cutins
  uint32 type = 2;    // position: 0 bottom-left / 1 bottom-mid / 2 bottom-right / 3-4 center / 255 clear
}

// Server -> client, a one-shot sound effect (replaces RO ZC_SOUND).
// Sent only to the invoking player (script `soundeffect`).
message SoundEffect {
  string name = 1;    // wav filename played from the client's data/wav directory
  uint32 type = 2;    // playback type (0 = data/wav)
}

// Client -> server, request an entity's name (replaces RO CZ_REQNAME2 0x0368).
message NameRequest {
  uint32 entity_id = 1;
}

// Server -> client, an entity's name (replaces RO ZC_ACK_REQNAME 0x0095 + ZC_ACK_REQNAMEALL 0x0195).
message NameResponse {
  uint32 gid = 1;
  string name = 2;
  string party_name = 3;
  string guild_name = 4;
  string position_name = 5;
}

// Client -> server, public chat message (replaces RO CZ_REQUEST_CHAT 0x008C).
message ChatRequest {
  string message = 1;
}

// Server -> client, an entity's chat message (replaces RO ZC_NOTIFY_CHAT 0x008D).
message ChatMessage {
  uint32 gid = 1;
  string message = 2;
}

// Client -> server, emote/emoticon request (replaces RO CZ_REQ_EMOTION 0x00bf).
message EmoteRequest {
  uint32 type = 1;
}

// Server -> client, an entity's emote/emoticon display (replaces RO ZC_EMOTION 0x00c0,
// which carries <gid>.L <type>.B).
message Emotion {
  uint32 gid = 1;
  uint32 type = 2;
}

// One entity's position/state within a Snapshot.
message SnapshotEntity {
  uint32 id = 1;
  uint32 x = 2;
  uint32 y = 3;
  uint32 dir = 4;
  uint32 move_state = 5;
  uint32 hp_pct = 6;
}

// Server -> client, full-state AoI snapshot (rides ChannelId 4 / Unreliable; design Part 5).
message Snapshot {
  uint64 server_tick = 1;
  repeated SnapshotEntity entities = 2;
}

// Client -> server, request a basic action against a target (replaces RO CZ_REQUEST_ACT 0x0437).
message ActionRequest {
  uint32 target_id = 1;
  uint32 action = 2;
}

// Server -> client, one authoritative basic-attack result (replaces RO ZC_NOTIFY_ACT 0x08C8).
// `damage` is the settled primary/right-hand aggregate; `damage2` is the settled
// left-hand or Katar secondary aggregate, or zero when absent. Their sum is the
// target HP mutation; a Devotion reroute instead zeroes both on the devotee packet
// while applying the raw aggregate once to the linked Crusader. Both are signed so
// negative (heal-as-damage) values survive. `div` is presentation-only: the number
// of equal visual hits for a multi-hit swing, not components or HP mutations.
message DamageDealt {
  uint32 src_id = 1;
  uint32 target_id = 2;
  uint64 server_tick = 3;
  uint32 src_speed = 4;
  uint32 dmg_speed = 5;
  sint32 damage = 6;
  uint32 div = 7;
  uint32 type = 8;
  sint32 damage2 = 9;
  bool is_sp_damage = 10;
}

// Server -> client, an entity was knocked back (replaces RO ZC_BLOWNBACK 0x01B1).
message Knockback {
  uint32 unit_id = 1;
  uint32 dst_x = 2;
  uint32 dst_y = 3;
}

// Client -> server, cast a skill at a target (replaces RO CZ_USE_SKILL 0x0113).
message SkillCast {
  uint32 skill_id = 1;
  uint32 level = 2;
  uint32 target_id = 3;
}

// Client -> server, cast a ground-targeted skill (replaces RO CZ_USE_SKILL_TOGROUND 0x0AF4).
message GroundSkillCast {
  uint32 skill_id = 1;
  uint32 level = 2;
  uint32 x = 3;
  uint32 y = 4;
}

// A prerequisite skill + level needed to learn a SkillInfo entry.
message SkillRequirement {
  uint32 skill_id = 1;
  uint32 level = 2;
}

// One skill within a SkillList; carries the full available-tree view.
message SkillInfo {
  uint32 skill_id = 1;
  uint32 type = 2;
  uint32 level = 3;
  uint32 sp = 4;
  uint32 range = 5;
  string name = 6;
  bool upgradable = 7;
  uint32 max_level = 8;
  repeated SkillRequirement requires = 9;
  uint32 req_base_level = 10;
  uint32 req_job_level = 11;
  uint32 job_id = 12;
  uint32 splash_radius = 13;
}

// Client -> server, spend one skill point to learn/raise a skill (replaces RO CZ_UPGRADE_SKILLLEVEL 0x0112).
message LearnSkill {
  uint32 skill_id = 1;
}

// Server -> client, result of a learn attempt; reason 0 = ok, else the SkillTree reject-reason code.
message LearnSkillResult {
  uint32 skill_id = 1;
  bool ok = 2;
  uint32 reason = 3;
}

// Server -> client, the full learned-skill list (replaces RO ZC_SKILLINFO_LIST 0x010F).
message SkillList {
  repeated SkillInfo skills = 1;
}

// Server -> client, skill damage result (replaces RO ZC_NOTIFY_SKILL 0x01DE).
message SkillDamage {
  uint32 skill_id = 1;
  uint32 level = 2;
  uint32 src_id = 3;
  uint32 target_id = 4;
  uint64 server_tick = 5;
  sint32 damage = 6;
  uint32 div = 7;
  uint32 type = 8;
  uint32 src_delay = 9;
  uint32 dst_delay = 10;
}

// Server -> client, no-damage skill effect (replaces RO ZC_USE_SKILL 0x011A).
message SkillEffect {
  uint32 skill_id = 1;
  uint32 level = 2;
  uint32 src_id = 3;
  uint32 target_id = 4;
  uint32 result = 5;
}

// Server -> client, a skill cast bar started (replaces RO ZC_USE_SKILL2 0x0B1A).
message SkillCasting {
  uint32 src_id = 1;
  uint32 target_id = 2;
  uint32 x = 3;
  uint32 y = 4;
  uint32 skill_id = 5;
  uint32 property = 6;
  uint32 cast_time = 7;
}

// Server -> client, a skill cast was cancelled (replaces RO ZC_NOTIFY_CAST_CANCEL 0x01B9).
message CastCancel {
  uint32 gid = 1;
}

// Server -> client, a skill went on cooldown (replaces RO ZC_SKILL_POSTDELAY 0x043D).
message SkillCooldown {
  uint32 skill_id = 1;
  uint32 tick = 2;
}

// Server -> client, a ground-targeted skill landed (replaces RO ZC_NOTIFY_GROUNDSKILL 0x0117).
message GroundSkill {
  uint32 skill_id = 1;
  uint32 src_id = 2;
  uint32 level = 3;
  uint32 x = 4;
  uint32 y = 5;
  uint64 server_tick = 6;
}

// Client -> server, equip an inventory item (replaces RO CZ_REQ_WEAR_EQUIP 0x0998).
message EquipItem {
  uint32 index = 1;
  uint32 position = 2;
}

// Client -> server, take off an equipped item (replaces RO CZ_REQ_TAKEOFF_EQUIP 0x00AB).
message UnequipItem {
  uint32 index = 1;
}

// Server -> client, result of an equip request (replaces RO ZC_ACK_WEAR_EQUIP 0x0999).
message EquipResult {
  uint32 index = 1;
  uint32 wear_location = 2;
  uint32 view_id = 3;
  uint32 result = 4;
}

// Server -> client, result of an unequip request (replaces RO ZC_ACK_TAKEOFF_EQUIP 0x099A).
message UnequipResult {
  uint32 index = 1;
  uint32 wear_location = 2;
  uint32 result = 3;
}

// One inventory slot within an InventoryList.
message InventoryItem {
  uint32 index = 1;
  uint32 nameid = 2;
  uint32 type = 3;
  uint32 amount = 4;
  uint32 location = 5;
  bool identified = 6;
  uint32 attribute = 7;
  uint32 refine = 8;
  repeated uint32 cards = 9;
  uint64 expire_time = 10;
  uint32 bind_on_equip = 11;
  bool favorite = 12;
  uint32 look = 13;
  // Per-unit weight from the item database (multiply by amount for the stack).
  uint32 weight = 14;
}

// Server -> client, the full inventory dump (collapses RO ZC_INVENTORY_START/
// ITEMLIST_NORMAL/ITEMLIST_EQUIP/END 0x0B08-0x0B0B).
message InventoryList {
  repeated InventoryItem normal = 1;
  repeated InventoryItem equip = 2;
}

// Server -> client, an item was added to the inventory (replaces RO ZC_ITEM_PICKUP_ACK 0x0A37).
message ItemAdded {
  uint32 index = 1;
  uint32 amount = 2;
  uint32 nameid = 3;
  bool identified = 4;
  uint32 attribute = 5;
  uint32 refine = 6;
  repeated uint32 cards = 7;
  uint32 location = 8;
  uint32 type = 9;
  uint32 result = 10;
  uint64 expire_time = 11;
  uint32 look = 12;
  // Per-unit weight from the item database.
  uint32 weight = 13;
}

// Server -> client, an item was removed from the inventory (replaces RO ZC_DELETE_ITEM_FROM_BODY 0x07FA).
message ItemRemoved {
  uint32 index = 1;
  uint32 amount = 2;
  uint32 reason = 3;
}

// Server -> client, an inventory item became bound (for example, on equip).
message ItemBound {
  uint32 index = 1; // Client inventory index.
  uint32 bound = 2; // Bound type (1 = account, 4 = character).
}

// Server -> client, the full cart dump (sent on mount/login). Mirrors InventoryList
// but for the separate cart container. Carries the cart's own weight totals so the
// client can render the cart-weight gauge (the cart cap is flat, not STR-derived).
message CartInfo {
  repeated InventoryItem items = 1;
  // Sum of every cart item's weight, at dump time.
  uint32 current_weight = 2;
  // Flat cart weight cap.
  uint32 max_weight = 3;
}

// Server -> client, an item was added to the cart. Mirrors ItemAdded.
message CartItemAdded {
  uint32 index = 1;
  uint32 amount = 2;
  uint32 nameid = 3;
  bool identified = 4;
  uint32 attribute = 5;
  uint32 refine = 6;
  repeated uint32 cards = 7;
  uint32 location = 8;
  uint32 type = 9;
  uint32 result = 10;
  uint64 expire_time = 11;
  uint32 look = 12;
  // Per-unit weight from the item database.
  uint32 weight = 13;
}

// Server -> client, an item was removed from the cart. Mirrors ItemRemoved.
message CartItemRemoved {
  uint32 index = 1;
  uint32 amount = 2;
  uint32 reason = 3;
}

// Client -> server, mount (true) or unmount (false) the cart. Gated on Pushcart learned.
message CartMountRequest {
  bool mount = 1;
}

// Outcome of a cart mount attempt. Values are prefixed because proto3 enum
// constants share the package namespace.
enum CartMountResultCode {
  CART_OK = 0;
  CART_SKILL_NOT_LEARNED = 1;
  CART_ALREADY_MOUNTED = 2;
}

// Server -> client, outcome of a cart mount attempt.
message CartMountResult {
  CartMountResultCode result = 1;
}

// Client -> server, mount (true) or unmount (false) a Peco. Gated on Ride learned.
message MountRequest {
  bool mount = 1;
}

// Outcome of a Peco mount attempt. Values are prefixed because proto3 enum
// constants share the package namespace.
enum MountResultCode {
  MOUNT_OK = 0;
  MOUNT_SKILL_NOT_LEARNED = 1;
  MOUNT_ALREADY_MOUNTED = 2;
  MOUNT_NOT_MOUNTED = 3;
  MOUNT_DEAD = 4;
}

// Server -> client, outcome of a Peco mount attempt.
message MountResult {
  MountResultCode result = 1;
}

// Client -> server, move an inventory item into the cart.
message MoveToCartRequest {
  uint32 inventory_index = 1;
  uint32 amount = 2;
}

// Client -> server, move a cart item back into the inventory.
message MoveFromCartRequest {
  uint32 cart_index = 1;
  uint32 amount = 2;
}

// One line of a vending shop the merchant wants to open: a cart slot, how many
// to sell, and the per-unit price.
message VendingEntry {
  uint32 cart_index = 1;
  uint32 amount = 2;
  uint32 price = 3;
}

// Client -> server, open a vending shop selling the given cart items under a title.
message VendingOpenRequest {
  string title = 1;
  repeated VendingEntry entries = 2;
}

// Outcome of a vending open attempt. Values are prefixed because proto3 enum
// constants share the package namespace.
enum VendingOpenResultCode {
  VEND_OK = 0;
  VEND_NO_CART = 1;
  VEND_SKILL_NOT_LEARNED = 2;
  VEND_TOO_MANY_SLOTS = 3;
  VEND_INVALID_AMOUNT = 4;
  VEND_INVALID_PRICE = 5;
  VEND_ITEM_NOT_IN_CART = 6;
  VEND_INSUFFICIENT_STOCK = 7;
  VEND_INVALID_STATE = 8;
}

// Server -> client, outcome of a vending open attempt.
message VendingOpenResult {
  VendingOpenResultCode result = 1;
}

// Client -> server, close the player's own vending shop.
message VendingCloseRequest {
}

// Client -> server, request the item list of a nearby vendor's shop.
message VendingListRequest {
  uint64 vendor_unit_id = 1;
}

// One line of a buy request: which shop entry and how many units to buy.
message VendingBuy {
  uint32 index = 1;
  uint32 amount = 2;
}

// Client -> server, buy items from a vendor's shop.
message VendingPurchaseRequest {
  uint64 vendor_unit_id = 1;
  repeated VendingBuy items = 2;
}

// Server -> client, a vending shop board appeared over a merchant (area broadcast / on view enter).
message VendingBoardShown {
  uint64 unit_id = 1;
  string title = 2;
}

// Server -> client, a vending shop board was removed (close / sold out / out of view).
message VendingBoardRemoved {
  uint64 unit_id = 1;
}

// One item on display in a vending shop. Mirrors InventoryItem's display fields plus a price.
message VendingShopItem {
  uint32 index = 1;
  uint32 nameid = 2;
  uint32 type = 3;
  uint32 amount = 4;
  bool identified = 5;
  uint32 attribute = 6;
  uint32 refine = 7;
  repeated uint32 cards = 8;
  uint32 price = 9;
}

// Server -> client, the full item list of a vendor's shop (reply to VendingListRequest).
message VendingList {
  uint64 vendor_unit_id = 1;
  string title = 2;
  repeated VendingShopItem items = 3;
}

// Server -> client (seller), a unit of the shop was sold.
message VendingSaleReport {
  uint32 index = 1;
  uint32 nameid = 2;
  uint32 amount = 3;
  uint32 zeny_gained = 4;
  string buyer_name = 5;
}

// One item the NPC shop sells, shown in the buy window at its buy price.
message NpcShopBuyItem {
  uint32 nameid = 1;
  uint32 type = 2;
  uint32 price = 3;
}

// One sellable inventory slot, shown in the sell window at its server-computed sell price.
message NpcShopSellItem {
  uint32 inventory_index = 1;
  uint32 nameid = 2;
  uint32 type = 3;
  uint32 amount = 4;
  uint32 sell_price = 5;
}

// Server -> client, opens the NPC shop window with both buy and sell lists computed server-side.
message NpcShopOpen {
  uint64 unit_id = 1;
  repeated NpcShopBuyItem buy_items = 2;
  repeated NpcShopSellItem sell_items = 3;
}

// One line of a buy request: which shop item and how many units to buy.
message NpcBuyEntry {
  uint32 nameid = 1;
  uint32 amount = 2;
}

// Client -> server, buy items from an NPC shop.
message NpcBuyRequest {
  uint64 unit_id = 1;
  repeated NpcBuyEntry items = 2;
}

// One line of a sell request: which inventory slot and how many units to sell.
message NpcSellEntry {
  uint32 inventory_index = 1;
  uint32 amount = 2;
}

// Client -> server, sell inventory items to an NPC shop.
message NpcSellRequest {
  uint64 unit_id = 1;
  repeated NpcSellEntry items = 2;
}

// Server -> client, result of a buy request (ok | not_enough_zeny | overweight | no_slots | invalid | out_of_range).
message NpcBuyResult {
  uint32 result = 1;
}

// Server -> client, result of a sell request (ok | invalid | out_of_range).
message NpcSellResult {
  uint32 result = 1;
}

// Client -> server, allocate a status point to a stat (replaces RO CZ_STATUS_CHANGE 0x00BB).
message StatUp {
  uint32 stat_id = 1;
  uint32 amount = 2;
}

// Server -> client, result of a stat allocation (replaces RO ZC_STATUS_CHANGE 0x00BC).
message StatUpResult {
  uint32 stat_id = 1;
  bool ok = 2;
  uint32 value = 3;
}

// Server -> client, a parameter changed (collapses RO ZC_PAR_CHANGE 0x00B0 +
// ZC_LONGPAR_CHANGE 0x00B1; uint64 covers both 32- and 64-bit params).
message ParamChange {
  uint32 var_id = 1;
  uint64 value = 2;
}

// Server -> client, an entity's HP changed (replaces RO ZC_HP_INFO 0x0977).
message UnitHp {
  uint32 id = 1;
  uint32 hp = 2;
  uint32 max_hp = 3;
}

// Server -> client, an entity's sprite changed (replaces RO ZC_SPRITE_CHANGE 0x01D7).
message SpriteChange {
  uint32 gid = 1;
  uint32 type = 2;
  uint32 val = 3;
  uint32 val2 = 4;
}

// Server -> client, an entity was resurrected (replaces RO ZC_RESURRECTION 0x0148).
message Resurrect {
  uint32 gid = 1;
  uint32 type = 2;
}

// Client -> server, respawn or return to char select after death (replaces RO CZ_RESTART 0x00B2).
message Respawn {
  uint32 type = 1;
}

// Client -> server, use a consumable item by inventory slot index (replaces RO CZ_USE_ITEM 0x00A7).
message UseItem {
  uint32 index = 1;
}

// Server -> client, result of a use-item attempt; reason 0 = ok, else the rejection code.
message ItemUseResult {
  uint32 index = 1;
  bool ok = 2;
  uint32 reason = 3;
}

// Client -> server, the player clicked an NPC unit (replaces RO CZ_CONTACTNPC 0x0090).
// npc_id is the NPC's unit/entity id on the map.
message NpcTalk {
  uint32 npc_id = 1;
}

// Server -> client, one frame per dialog suspension point; the mes text accumulated
// since the last suspension rides with it. `expect` names the input the client must
// now collect; `options` is populated for MENU only.
message NpcDialog {
  enum Expect {
    NEXT = 0;
    MENU = 1;
    INPUT_INT = 2;
    INPUT_STR = 3;
    CLOSE = 4;
  }

  uint32 npc_id = 1;
  string text = 2;
  Expect expect = 3;
  repeated string options = 4;
}

// Client -> server, the player's response to the pending NpcDialog.
message NpcInteract {
  uint32 npc_id = 1;
  oneof response {
    bool continue = 2;
    uint32 choice = 3;
    sint64 number = 4;
    string input = 5;
    bool cancel = 6;
  }
}

// Why a ground item disappeared.
enum ItemVanishReason {
  PICKED_UP = 0;
  EXPIRED = 1;
}

// Outcome of a pickup request.
enum PickupResultCode {
  OK = 0;
  TOO_FAR = 1;
  OVERWEIGHT = 2;
  INVENTORY_FULL = 3;
  GONE = 4;
  FAILED = 5;
  // The item is loot-protected for its owners' pickup windows; retry after the protection lapses.
  LOOT_PROTECTED = 6;
}

// Server -> client, an item appeared on a map cell (drop or walk-up discovery).
// is_falling marks a fresh drop (animated) vs an already-lying item (view-enter).
message ItemOnGround {
  uint64 ground_id = 1;
  uint32 nameid = 2;
  uint32 amount = 3;
  uint32 x = 4;
  uint32 y = 5;
  bool identified = 6;
  bool is_falling = 7;
  uint32 sub_x = 8;
  uint32 sub_y = 9;
}

// Server -> client, a ground item was removed (picked up or expired).
message ItemVanished {
  uint64 ground_id = 1;
  ItemVanishReason reason = 2;
}

// Client -> server, request to pick up a ground item by its ground id.
message PickupItemRequest {
  uint64 ground_id = 1;
}

// Server -> client, result of a pickup request; the inventory delta rides the existing ItemAdded.
message PickupResult {
  uint64 ground_id = 1;
  PickupResultCode result = 2;
}

// Client -> server, create a new party with the requester as leader.
message PartyCreateRequest {
  string name = 1;
}

// Client -> server, invite a character to the sender's party by id or by name
// (char_id wins when both are set; name is resolved via a UnitRegistry reverse lookup).
message PartyInviteRequest {
  uint32 target_char_id = 1;
  string target_name = 2;
}

// Server -> client, party invite notification shown to the invitee.
message PartyInviteNotify {
  uint32 party_id = 1;
  string party_name = 2;
  string inviter_name = 3;
}

// Client -> server, the invitee's accept/decline response to a PartyInviteNotify.
message PartyInviteResponse {
  uint32 party_id = 1;
  bool accept = 2;
}

// Client -> server, leave the sender's current party. If the sender is the
// leader, the party disbands instead.
message PartyLeaveRequest {}

// Client -> server, leader-only request to remove a member from the party.
message PartyKickRequest {
  uint32 target_char_id = 1;
}

// Client -> server, leader-only request to toggle even-share EXP.
message PartyOptionsRequest {
  bool exp_share = 1;
  // Leader-only rAthena-style party pickup-share option: party members of an online loot owner
  // inherit the owner's pickup window. The client sends the full desired state of both options
  // on every request (proto3 false-default).
  bool item_pickup_share = 2;
}

// Client -> server, leader-only request to transfer leadership to an online,
// same-map member.
message PartyLeaderRequest {
  uint32 target_char_id = 1;
}

// Reason a party request failed; NONE means it succeeded.
enum PartyError {
  NONE = 0;
  NAME_TAKEN = 1;
  ALREADY_IN_PARTY = 2;
  PARTY_FULL = 3;
  NOT_LEADER = 4;
  LEVEL_RANGE = 5;
  SAME_ACCOUNT = 6;
  TARGET_OFFLINE = 7;
  NOT_MEMBER = 8;
  NOT_SAME_MAP = 9;
}

// Server -> client, acknowledgement of a party request. `action` names the
// request being acked (e.g. "create", "invite", "kick"); `error` is
// PartyError.NONE on success.
message PartyActionResult {
  string action = 1;
  bool success = 2;
  PartyError error = 3;
}

// One member entry within a PartyInfo snapshot.
message PartyMember {
  uint32 char_id = 1;
  string name = 2;
  uint32 base_level = 3;
  bool online = 4;
  string map = 5;
  uint32 job_id = 6;
  uint64 hp = 7;
  uint64 max_hp = 8;
  uint64 sp = 9;
  uint64 max_sp = 10;
  uint32 ap = 11;
  uint32 max_ap = 12;
}

// Server -> client, full party snapshot sent on any membership or option change.
message PartyInfo {
  uint32 party_id = 1;
  string name = 2;
  uint32 leader_char_id = 3;
  bool exp_share = 4;
  repeated PartyMember members = 5;
  // Current party pickup-share setting, mirrored from the party options.
  bool item_pickup_share = 6;
}

// Server -> client, complete current snapshot for one party member.
message PartyMemberUpdate {
  uint32 party_id = 1;
  PartyMember member = 2;
}

// Server -> client, the party was disbanded (leader left, or the last member left).
message PartyDisbanded {
  uint32 party_id = 1;
  string reason = 2;
}

// Client -> server, create a new guild with the requester as guild master.
// Gated on holding an Emperium and not already being in a guild.
message GuildCreateRequest {
  string name = 1;
}

// Client -> server, invite a character to the sender's guild by id or by name
// (char_id wins when both are set; name is resolved via a UnitRegistry reverse lookup).
message GuildInviteRequest {
  uint32 target_char_id = 1;
  string target_name = 2;
}

// Client -> server, the invitee's accept/decline response to a GuildInviteNotify.
message GuildInviteResponse {
  uint32 guild_id = 1;
  bool accept = 2;
}

// Client -> server, leave the sender's current guild. If the sender is the
// guild master, the guild disbands instead.
message GuildLeaveRequest {}

// Client -> server, request (EXPEL permission) to remove a member from the guild.
message GuildExpelRequest {
  uint32 target_char_id = 1;
  string reason = 2;
}

// Client -> server, edit one position's title and permission flags
// (requires the :positions permission; index 0 is protected).
message GuildPositionEditRequest {
  uint32 index = 1;
  string name = 2;
  bool can_invite = 3;
  bool can_expel = 4;
}

// Client -> server, master-only request to assign a member to a position slot.
message GuildMemberPositionRequest {
  uint32 target_char_id = 1;
  uint32 index = 2;
}

// Client -> server, edit the guild notice (requires the :notice permission).
message GuildNoticeEditRequest {
  string subject = 1;
  string body = 2;
}

// Client -> server, master-only upload of a new emblem bitmap (24x24 BMP <= 100 KB).
message GuildEmblemUploadRequest {
  bytes data = 1;
}

// Client -> server, on-demand fetch of a guild's current emblem blob by version.
message GuildEmblemRequest {
  uint32 guild_id = 1;
  uint32 emblem_id = 2;
}

// Reason a guild request failed; NONE means it succeeded. Values are prefixed
// because proto3 enum constants share the package namespace (C++ scoping rules),
// and NONE/NAME_TAKEN/TARGET_OFFLINE/NOT_MEMBER already exist on PartyError.
enum GuildError {
  GUILD_ERR_NONE = 0;
  GUILD_ERR_NAME_TAKEN = 1;
  GUILD_ERR_ALREADY_IN_GUILD = 2;
  GUILD_ERR_GUILD_FULL = 3;
  GUILD_ERR_NO_PERMISSION = 4;
  GUILD_ERR_NOT_MEMBER = 5;
  GUILD_ERR_TARGET_OFFLINE = 6;
  GUILD_ERR_NO_EMPERIUM = 7;
  GUILD_ERR_INVALID_EMBLEM = 8;
  GUILD_ERR_CANNOT_TARGET_MASTER = 9;
  GUILD_ERR_INVALID_POSITION = 10;
}

// Server -> client, acknowledgement of a guild request. `action` names the
// request being acked (e.g. "create", "invite", "expel"); `error` is
// GuildError.GUILD_ERR_NONE on success.
message GuildActionResult {
  string action = 1;
  bool success = 2;
  GuildError error = 3;
}

// Server -> client, guild invite notification shown to the invitee.
message GuildInviteNotify {
  uint32 guild_id = 1;
  string guild_name = 2;
  string inviter_name = 3;
}

// One position slot within a GuildInfo. `can_storage` and `tax` are inert in phase 1.
message GuildPosition {
  uint32 index = 1;
  string name = 2;
  bool can_invite = 3;
  bool can_expel = 4;
  bool can_storage = 5;
  uint32 tax = 6;
}

// One member entry within a GuildInfo snapshot.
message GuildMember {
  uint32 char_id = 1;
  string name = 2;
  uint32 job_id = 3;
  uint32 base_level = 4;
  bool online = 5;
  string map = 6;
  uint32 position_index = 7;
  uint64 hp = 8;
  uint64 max_hp = 9;
  uint64 sp = 10;
  uint64 max_sp = 11;
  uint32 ap = 12;
  uint32 max_ap = 13;
}

// Server -> client, full guild snapshot sent on any membership, position, or
// notice change. The emblem blob is not inlined; clients fetch it via
// GuildEmblemRequest keyed on emblem_id.
message GuildInfo {
  uint32 guild_id = 1;
  string name = 2;
  uint32 master_char_id = 3;
  uint32 emblem_id = 4;
  string notice_subject = 5;
  string notice_body = 6;
  repeated GuildPosition positions = 7;
  repeated GuildMember members = 8;
}

// Server -> client, complete current snapshot for one guild member.
message GuildMemberUpdate {
  uint32 guild_id = 1;
  GuildMember member = 2;
}

// Server -> client, the guild's emblem version changed; clients lacking this
// emblem_id should issue a GuildEmblemRequest to fetch the new blob.
message GuildEmblemChanged {
  uint32 guild_id = 1;
  uint32 emblem_id = 2;
}

// Server -> client, the emblem blob for a guild at a given version (reply to
// GuildEmblemRequest). Served straight from Postgres from any node.
message GuildEmblemData {
  uint32 guild_id = 1;
  uint32 emblem_id = 2;
  bytes data = 3;
}

// Server -> client, the guild was disbanded (guild master left, or removed).
message GuildDisbanded {
  uint32 guild_id = 1;
  string reason = 2;
}

// Server -> client, the full storage dump (sent on open). Mirrors CartInfo.
message StorageOpened {
  uint32 capacity = 1;
  repeated InventoryItem items = 2;
}

// Client -> server, move an inventory item into storage.
message StorageDepositRequest {
  uint32 inventory_index = 1;
  uint32 amount = 2;
}

// Client -> server, move a storage item back into the inventory.
message StorageWithdrawRequest {
  uint32 storage_index = 1;
  uint32 amount = 2;
}

// Client -> server, close the currently open storage window.
message StorageCloseRequest {}

// Server -> client, an item was added to storage. Mirrors CartItemAdded.
message StorageItemAdded {
  uint32 index = 1;
  uint32 amount = 2;
  uint32 nameid = 3;
  bool identified = 4;
  uint32 attribute = 5;
  uint32 refine = 6;
  repeated uint32 cards = 7;
  uint32 location = 8;
  uint32 type = 9;
  uint32 result = 10;
  uint64 expire_time = 11;
  uint32 look = 12;
  // Per-unit weight from the item database.
  uint32 weight = 13;
}

// Server -> client, an item was removed from storage. Mirrors CartItemRemoved.
message StorageItemRemoved {
  uint32 index = 1;
  uint32 amount = 2;
  uint32 reason = 3;
}

// Outcome of a storage deposit/withdraw/open request. Values are prefixed
// because proto3 enum constants share the package namespace (C++ scoping
// rules), and OK/INVENTORY_FULL/OVERWEIGHT already exist on PickupResultCode.
enum StorageResultCode {
  STORAGE_OK = 0;
  STORAGE_FULL = 1;
  STORAGE_INVENTORY_FULL = 2;
  STORAGE_OVERWEIGHT = 3;
  STORAGE_NOT_STORABLE = 4;
  STORAGE_ITEM_EQUIPPED = 5;
  STORAGE_INVALID_AMOUNT = 6;
  STORAGE_NOT_OPEN = 7;
  STORAGE_BASIC_SKILL_REQUIRED = 8;
}

// Server -> client, result of a storage deposit/withdraw/open request.
message StorageResult {
  StorageResultCode result = 1;
}

// Server -> client, a styled broadcast message (GM @broadcast, or the rAthena
// announce/mapannounce/areaannounce/broadcast script buildins).
message Announcement {
  enum Style {
    TOP = 0;
    CENTER = 1;
    LOCAL = 2;
  }

  string text = 1;
  uint32 color = 2;
  Style style = 3;
  string source_name = 4;
}

// One hunt objective within a QuestEntry, joining the persisted counter with
// the quest definition's target so the client needs no quest database of its
// own. `needed` is copied from the quest definition; `current` is clamped
// by the server.
message QuestObjective {
  uint32 mob_id = 1;
  uint32 needed = 2;
  uint32 current = 3;
}

// One quest-log row within a QuestList/QuestAdded. `state` mirrors rAthena's
// e_quest_state: 0 = inactive, 1 = active, 2 = complete. `objectives` is empty
// for a quest with no hunt targets, or whose definition no longer resolves.
message QuestEntry {
  uint32 quest_id = 1;
  uint32 state = 2;
  repeated QuestObjective objectives = 3;
}

// Server -> client, the full quest log dump (sent on map load, mirrors InventoryList).
message QuestList {
  repeated QuestEntry quests = 1;
}

// Server -> client, a quest entered the log (setquest, or the new side of changequest).
message QuestAdded {
  QuestEntry quest = 1;
}

// Server -> client, a quest left the log (erasequest, or the old side of changequest).
message QuestRemoved {
  uint32 quest_id = 1;
}

// Server -> client, a quest's state changed in place, objectives unaffected
// (completequest). See QuestEntry.state for the value meaning.
message QuestStateChanged {
  uint32 quest_id = 1;
  uint32 state = 2;
}

// Server -> client, one hunt objective's counter advanced
// (quest_update_objective). `objective_index` is positional within the
// quest's targets; `count`/`needed` are the new (clamped) current and cap.
message QuestHuntProgress {
  uint32 quest_id = 1;
  uint32 objective_index = 2;
  uint32 count = 3;
  uint32 needed = 4;
}

// The identity kind for an actor that owns a persistent skill-unit group or
// causes a skill-unit update. In group state it identifies the caster/owner;
// in update state it identifies the damage source. UNSPECIFIED with ID zero
// means no actor applies, such as an automatic DECAY update.
enum SkillUnitOwnerType {
  SKILL_UNIT_OWNER_TYPE_UNSPECIFIED = 0;
  SKILL_UNIT_OWNER_TYPE_PLAYER = 1;
  SKILL_UNIT_OWNER_TYPE_MOB = 2;
  SKILL_UNIT_OWNER_TYPE_NPC = 3;
}

// A persistent skill-unit cell's client-visible traits. Flags may be combined:
// bit 0 targetable, bit 1 blocks movement, bit 2 blocks projectiles, bit 3
// consumable water, bit 4 visible. HP values are zero for non-destructible cells.
message SkillUnitCellState {
  uint32 cell_id = 1;
  int32 x = 2;
  int32 y = 3;
  uint32 hp = 4;
  uint32 max_hp = 5;
  uint32 flags = 6;
}

// Lifecycle state: active normally operates; used/sprung are visible inert states;
// captured is visible and inert while linked to a captured target.
enum SkillUnitPhase {
  SKILL_UNIT_PHASE_ACTIVE = 0;
  SKILL_UNIT_PHASE_USED = 1;
  SKILL_UNIT_PHASE_SPRUNG = 2;
  SKILL_UNIT_PHASE_CAPTURED = 3;
}

// Complete authoritative state for one persistent skill-unit cast. The stream
// is scoped to the observer's current map, so no map identifier is required.
message SkillUnitGroupState {
  uint64 group_id = 1;
  uint32 skill_id = 2;
  uint32 skill_level = 3;
  SkillUnitOwnerType owner_type = 4;
  uint32 owner_id = 5;
  int32 center_x = 6;
  int32 center_y = 7;
  uint64 created_tick = 8;
  uint64 expires_tick = 9;
  repeated SkillUnitCellState cells = 10;
  SkillUnitPhase phase = 11;
}

// Server -> client, an authoritative replacement for the observer's complete
// active visible skill-unit set.
message SkillUnitSnapshot {
  uint64 server_tick = 1;
  repeated SkillUnitGroupState groups = 2;
}

// Server -> client, complete current state for a group entering visibility.
message SkillUnitSpawn {
  SkillUnitGroupState group = 1;
}

// Why a skill-unit cell's authoritative HP changed.
enum SkillUnitUpdateReason {
  SKILL_UNIT_UPDATE_REASON_UNSPECIFIED = 0;
  SKILL_UNIT_UPDATE_REASON_DAMAGE = 1;
  SKILL_UNIT_UPDATE_REASON_DECAY = 2;
}

// Server -> client, an authoritative HP change for one persistent skill-unit cell.
// `hp_delta` is signed. `source_type` and `source_id` identify the actor that
// caused DAMAGE; automatic updates use UNSPECIFIED and zero.
message SkillUnitUpdate {
  uint64 group_id = 1;
  uint32 cell_id = 2;
  uint32 hp = 3;
  uint32 max_hp = 4;
  sint32 hp_delta = 5;
  SkillUnitOwnerType source_type = 6;
  uint32 source_id = 7;
  SkillUnitUpdateReason reason = 8;
  uint64 server_tick = 9;
}

// Why one or more skill-unit cells were removed. Selected cell IDs do not
// imply that their parent group or its other cells were removed.
enum SkillUnitDespawnReason {
  SKILL_UNIT_DESPAWN_REASON_UNSPECIFIED = 0;
  SKILL_UNIT_DESPAWN_REASON_EXPIRED = 1;
  SKILL_UNIT_DESPAWN_REASON_DESTROYED = 2;
  SKILL_UNIT_DESPAWN_REASON_SOURCE_CONSUMED = 3;
  SKILL_UNIT_DESPAWN_REASON_LIFECYCLE = 4;
  SKILL_UNIT_DESPAWN_REASON_MAP_SHUTDOWN = 5;
  SKILL_UNIT_DESPAWN_REASON_LEFT_VIEW = 6;
  SKILL_UNIT_DESPAWN_REASON_CANCELED = 7;
}

// Server -> client, removes the listed cells from a persistent group.
message SkillUnitDespawn {
  uint64 group_id = 1;
  repeated uint32 cell_ids = 2;
  SkillUnitDespawnReason reason = 3;
  uint64 server_tick = 4;
}

// Server -> client, caster-only result for Estimation. Element modifiers are
// signed percentages for Water, Earth, Fire, Wind, Poison, Holy, Shadow,
// Ghost, and Undead respectively.
message EstimationResult {
  uint32 target_id = 1;
  uint32 class_id = 2;
  uint32 level = 3;
  uint32 size = 4;
  uint32 hp = 5;
  uint32 def = 6;
  uint32 race = 7;
  uint32 mdef = 8;
  uint32 element = 9;
  sint32 water_modifier = 10;
  sint32 earth_modifier = 11;
  sint32 fire_modifier = 12;
  sint32 wind_modifier = 13;
  sint32 poison_modifier = 14;
  sint32 holy_modifier = 15;
  sint32 shadow_modifier = 16;
  sint32 ghost_modifier = 17;
  sint32 undead_modifier = 18;
  uint64 server_tick = 19;
}

// Server -> client, the list of choices a skill offers; the client renders it as
// the widget `kind` names and answers with exactly one SkillMenuReply. Entries are
// ids rather than display strings so the client can draw real skill-icon and
// item-craft widgets (rAthena ZC_AUTOSPELLLIST / clif_elementalconverter_list);
// the NpcDialog flow is the string-carrying dialog-box path and is not this.
message SkillMenu {
  enum Kind {
    SKILLS = 0;
    ITEMS = 1;
    INVENTORY_SLOTS = 2; // entry_ids identify inventory slots rather than items.
  }

  uint32 src_skill_id = 1;
  Kind kind = 2;
  repeated uint32 entry_ids = 3;
}

// Client -> server, the player's choice from the pending SkillMenu. `src_skill_id`
// must match the offer the server is holding and `selected_id` must be one of its
// entry_ids; a stale or forged reply is dropped. selected_id 0 cancels the menu.
message SkillMenuReply {
  uint32 src_skill_id = 1;
  uint32 selected_id = 2;
  repeated uint32 extra_ids = 3; // Up to three additional catalyst item ids.
}

// Server -> client, the outcome of an item-production attempt.
message ProductionResult {
  // Whether the attempt produced the item.
  bool success = 1;
  // The recipe's product item id, on either outcome.
  uint32 item_id = 2;
}

enum SkillCastFailureReason {
  SKILL_CAST_FAILURE_REASON_UNSPECIFIED = 0;
  SKILL_CAST_FAILURE_REASON_MISSING_CATALYST = 1;
  SKILL_CAST_FAILURE_REASON_INSUFFICIENT_SP = 2;
  SKILL_CAST_FAILURE_REASON_INSUFFICIENT_ZENY = 3;
  SKILL_CAST_FAILURE_REASON_NO_AMMO = 4;
  SKILL_CAST_FAILURE_REASON_ON_COOLDOWN = 5;
  SKILL_CAST_FAILURE_REASON_INVALID_TARGET = 6;
  SKILL_CAST_FAILURE_REASON_NOT_LEARNED = 7;
  SKILL_CAST_FAILURE_REASON_OUT_OF_RANGE = 8;
  SKILL_CAST_FAILURE_REASON_BUSY = 9;
  SKILL_CAST_FAILURE_REASON_WRONG_WEAPON = 10;
  SKILL_CAST_FAILURE_REASON_VERSUS_MAP_ONLY = 11;
}

// Server -> client, caster-only feedback when an attempted skill cast is rejected.
message SkillCastFailed {
  uint32 skill_id = 1;
  SkillCastFailureReason reason = 2;
}

// Client -> server. The authenticated character's sole Homunculus is implicit;
// requests intentionally carry no owner or companion selector.
message HomunculusRequest {
  uint64 request_id = 1;

  oneof command {
    HomunculusInspectCommand inspect = 2;
    HomunculusMoveCommand move = 3;
    HomunculusFollowCommand follow = 4;
    HomunculusAttackCommand attack = 5;
    HomunculusStandbyCommand standby = 6;
    HomunculusCastSkillCommand cast_skill = 7;
    HomunculusFeedCommand feed = 8;
    HomunculusRenameCommand rename = 9;
    HomunculusRestCommand rest = 10;
    HomunculusDeleteCommand delete = 11;
    HomunculusReplaceAiCommand replace_ai = 12;
    HomunculusLearnSkillCommand learn_skill = 13;
  }
}

message HomunculusInspectCommand {}
message HomunculusMoveCommand { int32 x = 1; int32 y = 2; }
message HomunculusFollowCommand {}
message HomunculusAttackCommand { uint32 target_id = 1; }
message HomunculusStandbyCommand {}

message HomunculusCastSkillCommand {
  uint32 skill_id = 1;
  uint32 level = 2;

  oneof target {
    uint32 target_id = 3;
    bool self = 4;
  }
}

message HomunculusFeedCommand {}
message HomunculusRenameCommand { string name = 1; }
message HomunculusRestCommand {}
message HomunculusDeleteCommand { bool confirmed = 1; }
message HomunculusReplaceAiCommand { HomunculusAiConfig config = 1; }
message HomunculusLearnSkillCommand { uint32 skill_id = 1; }

enum HomunculusAiStance {
  HOMUNCULUS_AI_STANCE_UNSPECIFIED = 0;
  HOMUNCULUS_AI_STANCE_PASSIVE = 1;
  HOMUNCULUS_AI_STANCE_ASSIST = 2;
  HOMUNCULUS_AI_STANCE_AGGRESSIVE = 3;
}

enum HomunculusAiSkillMode {
  HOMUNCULUS_AI_SKILL_MODE_UNSPECIFIED = 0;
  HOMUNCULUS_AI_SKILL_MODE_MANUAL = 1;
  HOMUNCULUS_AI_SKILL_MODE_AUTO = 2;
}

// Presence distinguishes an omitted threshold from an explicit zero value;
// validation applies the approved percentage boundaries.
message HomunculusHpThreshold { uint32 percent = 1; }
message HomunculusHpRange { uint32 min_percent = 1; uint32 max_percent = 2; }

message HomunculusAiSkillConfig {
  uint32 skill_id = 1;
  HomunculusAiSkillMode mode = 2;
  uint32 priority = 3;
  HomunculusHpThreshold self_hp_threshold = 4;
  HomunculusHpThreshold owner_hp_threshold = 5;
  HomunculusHpRange target_hp_range = 6;
}

// Complete replacement AI configuration. Claim safety is mandatory server-side
// and therefore is not configurable on the wire.
message HomunculusAiConfig {
  HomunculusAiStance stance = 1;
  uint32 leash_distance = 2;
  bool join_owner_target = 3;
  bool retaliate = 4;
  bool avoid_bosses = 5;
  repeated uint32 allowed_mob_class_ids = 6;
  repeated uint32 denied_mob_class_ids = 7;
  bool auto_feed = 8;
  uint32 auto_feed_threshold = 9;
  uint32 auto_cast_sp_reserve_percent = 10;
  repeated HomunculusAiSkillConfig skills = 11;
}

enum HomunculusError {
  HOMUNCULUS_ERROR_NONE = 0;
  HOMUNCULUS_ERROR_NO_COMPANION = 1;
  HOMUNCULUS_ERROR_MALFORMED_COMMAND = 2;
  HOMUNCULUS_ERROR_WRONG_CHANNEL = 3;
  HOMUNCULUS_ERROR_INVALID_LIFECYCLE = 4;
  HOMUNCULUS_ERROR_INVALID_POSITION = 5;
  HOMUNCULUS_ERROR_INVALID_TARGET = 6;
  HOMUNCULUS_ERROR_OUT_OF_RANGE = 7;
  HOMUNCULUS_ERROR_SKILL_NOT_LEARNED = 8;
  HOMUNCULUS_ERROR_INVALID_SKILL_RANK = 9;
  HOMUNCULUS_ERROR_ON_COOLDOWN = 10;
  HOMUNCULUS_ERROR_INSUFFICIENT_SP = 11;
  HOMUNCULUS_ERROR_MISSING_ITEM = 12;
  HOMUNCULUS_ERROR_HP_GATE = 13;
  HOMUNCULUS_ERROR_RENAME_NOT_ALLOWED = 14;
  HOMUNCULUS_ERROR_INVALID_NAME = 15;
  HOMUNCULUS_ERROR_CONFIRMATION_REQUIRED = 16;
  HOMUNCULUS_ERROR_INVALID_AI_CONFIG = 17;
  HOMUNCULUS_ERROR_INSUFFICIENT_SKILL_POINTS = 18;
  HOMUNCULUS_ERROR_PREREQUISITES_NOT_MET = 19;
  HOMUNCULUS_ERROR_BUSY = 20;
}

enum HomunculusLifecycle {
  HOMUNCULUS_LIFECYCLE_UNSPECIFIED = 0;
  HOMUNCULUS_LIFECYCLE_ACTIVE = 1;
  HOMUNCULUS_LIFECYCLE_RESTED = 2;
  HOMUNCULUS_LIFECYCLE_DEAD = 3;
}

enum HomunculusActivity {
  HOMUNCULUS_ACTIVITY_UNSPECIFIED = 0;
  HOMUNCULUS_ACTIVITY_IDLE = 1;
  HOMUNCULUS_ACTIVITY_FOLLOWING = 2;
  HOMUNCULUS_ACTIVITY_MOVING = 3;
  HOMUNCULUS_ACTIVITY_ATTACKING = 4;
  HOMUNCULUS_ACTIVITY_CASTING = 5;
  HOMUNCULUS_ACTIVITY_STANDBY = 6;
}

enum HomunculusIntimacyGrade {
  HOMUNCULUS_INTIMACY_GRADE_UNSPECIFIED = 0;
  HOMUNCULUS_INTIMACY_GRADE_HATE_WITH_PASSION = 1;
  HOMUNCULUS_INTIMACY_GRADE_HATE = 2;
  HOMUNCULUS_INTIMACY_GRADE_AWKWARD = 3;
  HOMUNCULUS_INTIMACY_GRADE_SHY = 4;
  HOMUNCULUS_INTIMACY_GRADE_NEUTRAL = 5;
  HOMUNCULUS_INTIMACY_GRADE_CORDIAL = 6;
  HOMUNCULUS_INTIMACY_GRADE_LOYAL = 7;
}

message HomunculusDisplayedStats {
  uint32 str = 1;
  uint32 agi = 2;
  uint32 vit = 3;
  uint32 int = 4;
  uint32 dex = 5;
  uint32 luk = 6;
  uint32 atk = 7;
  uint32 matk = 8;
  uint32 def = 9;
  uint32 mdef = 10;
  uint32 hit = 11;
  uint32 flee = 12;
  uint32 critical = 13;
  uint32 aspd = 14;
}

message HomunculusSkillMetadata {
  uint32 skill_id = 1;
  uint32 level = 2;
  uint32 max_level = 3;
  bool learnable = 4;
  uint32 intimacy_required_hundredths = 5;
}

message HomunculusCooldown {
  uint32 skill_id = 1;
  uint64 remaining_ms = 2;
}

// Server -> owner, complete authoritative private companion state.
message HomunculusPrivateState {
  uint64 durable_id = 1;
  uint32 world_gid = 2;
  string name = 3;
  bool rename_eligible = 4;
  uint32 species_id = 5;
  bool evolved = 6;
  uint32 appearance_id = 7;
  HomunculusLifecycle lifecycle = 8;
  HomunculusActivity activity = 9;
  uint32 current_target_id = 10;
  uint32 level = 11;
  uint64 exp = 12;
  uint64 next_exp = 13;
  uint32 skill_points = 14;
  uint64 hp = 15;
  uint64 max_hp = 16;
  uint64 sp = 17;
  uint64 max_sp = 18;
  HomunculusDisplayedStats stats = 19;
  uint32 hunger = 20;
  uint32 intimacy_hundredths = 21;
  HomunculusIntimacyGrade intimacy_grade = 22;
  uint32 food_item_id = 23;
  uint64 active_remaining_ms = 24;
  repeated HomunculusSkillMetadata skills = 25;
  repeated HomunculusCooldown cooldowns = 26;
  HomunculusAiConfig ai_config = 27;
}

// Server -> owner, correlated outcome and immediate authoritative post-state.
// State is absent only when no companion exists or confirmed deletion succeeds.
message HomunculusResult {
  uint64 request_id = 1;
  bool success = 2;
  HomunculusError error = 3;
  HomunculusPrivateState state = 4;
}
