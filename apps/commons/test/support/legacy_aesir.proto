syntax = "proto3";
package aesir.legacy_net;

message Hello {
  uint32 protocol_version = 1;
  string build = 2;
}

message HelloAck {
  uint32 protocol_version = 1;
  bool accepted = 2;
}

enum SkillUnitOwnerType {
  SKILL_UNIT_OWNER_TYPE_UNSPECIFIED = 0;
  SKILL_UNIT_OWNER_TYPE_PLAYER = 1;
  SKILL_UNIT_OWNER_TYPE_MOB = 2;
  SKILL_UNIT_OWNER_TYPE_NPC = 3;
}

message SkillUnitCellState {
  uint32 cell_id = 1;
  int32 x = 2;
  int32 y = 3;
  uint32 hp = 4;
  uint32 max_hp = 5;
  uint32 flags = 6;
}

message SkillUnitGroupState {
  uint64 group_id = 1;
  uint32 skill_id = 2;
  uint32 skill_level = 3;
  SkillUnitOwnerType owner_type = 4;
  uint32 owner_id = 5;
  int32 center_x = 6;
  int32 center_y = 7;
  uint64 created_tick = 8;
  uint64 expires_tick = 9;
  repeated SkillUnitCellState cells = 10;
}
